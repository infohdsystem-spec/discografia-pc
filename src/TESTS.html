<script>
const _suites = [];
let _currentSuite = null;

function describe(name, fn){
  _currentSuite = { name, tests: [] };
  _suites.push(_currentSuite);
  fn();
  _currentSuite = null;
}
function it(name, fn){
  if (!_currentSuite) throw new Error('it() fuera de describe()');
  _currentSuite.tests.push({ name, fn });
}
function expect(actual){
  return {
    toBe(expected){ if (actual !== expected) throw new Error(`Esperado: ${JSON.stringify(expected)}\nRecibido: ${JSON.stringify(actual)}`); },
    toBeNull(){ if (actual !== null) throw new Error(`Esperado: null\nRecibido: ${JSON.stringify(actual)}`); },
    toBeUndefined(){ if (actual !== undefined) throw new Error(`Esperado: undefined\nRecibido: ${JSON.stringify(actual)}`); },
    toBeGreaterThan(n){ if (!(actual > n)) throw new Error(`Esperado: > ${n}\nRecibido: ${JSON.stringify(actual)}`); },
    toBeGreaterThanOrEqual(n){ if (!(actual >= n)) throw new Error(`Esperado: >= ${n}\nRecibido: ${JSON.stringify(actual)}`); },
    toBeLessThan(n){ if (!(actual < n)) throw new Error(`Esperado: < ${n}\nRecibido: ${JSON.stringify(actual)}`); },
    toBeLessThanOrEqual(n){ if (!(actual <= n)) throw new Error(`Esperado: <= ${n}\nRecibido: ${JSON.stringify(actual)}`); },
    toEqual(expected){ const a = JSON.stringify(actual), b = JSON.stringify(expected); if (a !== b) throw new Error(`Esperado: ${b}\nRecibido: ${a}`); },
    toBeTruthy(){ if (!actual) throw new Error(`Esperado truthy\nRecibido: ${JSON.stringify(actual)}`); }
  };
}

const norm = s => String(s ?? '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

const normMatch = s => String(s||'').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();

function stripParenthetical(s){ return String(s||'').replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ').replace(/\s+/g, ' ').trim(); }
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);

}
function stripArticles(s){ return String(s||'').replace(/^(the|a|an|el|la|los|las|un|una)\s+/i,'').replace(/\s+(the|a|an|el|la|los|las|un|una)$/i,'').trim(); }
function similarity(a, b){
  const x = normMatch(stripArticles(a)), y = normMatch(stripArticles(b));
  if (!x || !y) return 0;
  if (x === y) return 1;
  if (x.includes(y) || y.includes(x)) return 0.9;
  const A = new Set(x.split(' ')), B = new Set(y.split(' '));
  const inter = [...A].filter(v => B.has(v)).length;
  const union = new Set([...A, ...B]).size;
  const j = union ? inter / union : 0;
  const lev = 1 - levenshtein(x, y) / Math.max(x.length, y.length);
  return Math.max(j, lev * 0.9);
}
function matchConfidence(t, i, cand){ return Math.round((similarity(t, cand.title) * 0.6 + similarity(i, cand.artist) * 0.4) * 100); }
function esSoloOrtografia(a, b){
  const A = String(a||'').trim(), B = String(b||'').trim();
  if (!A || !B) return false;
  const an = normMatch(A), bn = normMatch(B);
  if (an === bn) return true;
  const ap = normMatch(stripParenthetical(A));
  const bp = normMatch(stripParenthetical(B));
  if (ap && bp && ap === bp) return true;
  const wa = an.split(' ').filter(Boolean);
  const wb = bn.split(' ').filter(Boolean);
  if (wa.length === wb.length && wa.length > 0){
    let sameCount = 0;
    for (let i = 0; i < wa.length; i++){
      if (wa[i] === wb[i]){ sameCount++; continue; }
      const wLev = levenshtein(wa[i], wb[i]);
      const maxLen = Math.max(wa[i].length, wb[i].length);
      if (maxLen > 0 && wLev / maxLen <= 0.35) sameCount++;
    }
    if (sameCount === wa.length) return true;
  }
  const sim = similarity(A, B);
  const lenDiff = Math.abs(A.length - B.length);
  if (sim >= 0.90 && lenDiff <= 3) return true;
  return false;
}
function corregirCampo(valorActual, valorAPI, confianza, replace, umbralMin = 85){
  const cur = String(valorActual || '').trim();
  const api = String(valorAPI  || '').trim();
  if (!api) return null;
  if (Number(confianza) < umbralMin) return null;
  if (cur === api) return null;
  if (!cur) return api;
  if (esSoloOrtografia(cur, api)) return api;
  if (replace) return api;
  return null;
}
function isSafeImageUrl(url){
  if (!url || typeof url !== 'string') return false;
  if (/^https?:\/\//i.test(url)) return true;
  if (/^data:image\/(png|jpe?g|gif|webp|svg\+xml);/i.test(url)) return true;
  if (/^blob:/i.test(url)) return true;

}
function isSafeStreamUrl(url){
  if (!url || typeof url !== 'string') return false;
  if (!/^https:\/\//i.test(url)) return false;
  try { const u = new URL(url); const host = u.hostname.toLowerCase(); return ALLOWED_STREAM_DOMAINS.some(d => host === d || host.endsWith('.' + d)); } catch(e){ return false; }
}
function isAlbumUrl(url, svcKey){
  if (!url) return false;
  try { const u = new URL(url); const path = u.pathname.toLowerCase() + u.search.toLowerCase();
    switch(svcKey){
      case 'spotify': return path.includes('/album/') && !path.includes('/track/') && !path.includes('/playlist/');
      case 'apple': return path.includes('/album/');
      case 'youtube': return path.includes('olak5uy') || path.includes('/browse/') || path.includes('/playlist');
      case 'discogs': return path.includes('/release/') || path.includes('/master/');

}
function detectDelimiter(t){ const f = String(t).split(/\r?\n/)[0] || ""; return (f.match(/;/g) || []).length >= (f.match(/,/g) || []).length ? ";" : ","; }
function parseCSV(text, delim){
  const d = delim || detectDelimiter(text);
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], n = text[i+1];
    if (inQ){ if (c === '"' && n === '"'){ cur += '"'; i++; } else if (c === '"') inQ = false; else cur += c; }
    else { if (c === '"') inQ = true; else if (c === d){ row.push(cur); cur = ""; } else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ""; } else if (c === '\r'){} else cur += c; }
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }

}
function normalizeYear(y){
  if (y === null || y === undefined || y === '') return null;
  const n = parseInt(String(y).slice(0, 4), 10);
  if (!Number.isFinite(n)) return null;
  if (n < 1900 || n > 2100) return null;

}
function limpiarTituloParaBusqueda(titulo){
  let t = String(titulo || '').trim();
  if (!t) return '';
  t = t.replace(/[*#]+/g, ' ');
  t = t.replace(/\.{2,}/g, ' ');
  const parts = t.split(/\s*\/\s*/);
  if (parts.length === 2 && normMatch(parts[0]) === normMatch(parts[1])) t = parts[0];
  t = t.replace(/\s*\(\s*(en\s+vivo|live)\s*\)\s*$/i, '').trim();
  t = t.replace(/\s+(CD|VOL|VOLUMEN|PARTE|DISC|DISCO)\s*#?\s*\d+\s*$/i, '').trim();
  t = t.replace(/\s+GIRA\s+/i, ' ').trim();
  t = t.replace(/\s+([AB])\s*$/i, (m) => { const sinLado = t.replace(/\s+([AB])\s*$/i, '').trim(); return sinLado.length >= 5 ? '' : m; }).trim();

}

const MIGRATIONS = [
  { from: 1, to: 2, name: 'Categorías planas → objeto con metadatos',
    fn: d => { if (!d || typeof d !== 'object') return d; if (Array.isArray(d.categories)){ const obj = {}; for (const c of d.categories){ const key = String(c.key || c.label || ('cat_' + Math.random().toString(36).slice(2, 8))).toLowerCase(); obj[key] = { label: c.label || key, icon: c.icon || '📀', subcategories: [], cds: Array.isArray(c.cds) ? c.cds : [] }; } d.categories = obj; } return d; } },
  { from: 4, to: 5, name: 'Aplanar estructura de CDs + normalizar campos',
    fn: d => { if (!d || typeof d !== 'object' || !d.categories) return d; for (const k in d.categories){ const cat = d.categories[k]; if (!cat || !Array.isArray(cat.cds)) continue; cat.cds = cat.cds.map(cd => { if (!cd || typeof cd !== 'object') return cd; if (!cd.id) cd.id = (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'cd_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2)); if (!cd.links || typeof cd.links !== 'object' || Array.isArray(cd.links)) cd.links = {}; if (!cd.customFields || typeof cd.customFields !== 'object') cd.customFields = {}; if (!cd.provenance || typeof cd.provenance !== 'object') cd.provenance = {}; if (cd.subcat === undefined) cd.subcat = null; return cd; }); if (!Array.isArray(cat.subcategories)) cat.subcategories = []; } return d; } },
  { from: 5, to: 6, name: 'Normalizar prefs + agregar flagged de migración',
    fn: d => { if (!d || typeof d !== 'object') return d; const defaults = { enrich: true, autoBackup: true, replaceOnEnrich: true }; d.prefs = Object.assign({}, defaults, d.prefs || {}); if (d.seeded === undefined) d.seeded = true; return d; } }
];
function migrateBackup(raw, fromVersion, migrations = MIGRATIONS){
  if (!raw || typeof raw !== 'object') return { data: raw, applied: [] };
  const current = Number(fromVersion) || 1;
  if (current >= SCHEMA_VERSION) return { data: raw, applied: [] };
  let data = JSON.parse(JSON.stringify(raw));
  const applied = [];
  for (const m of migrations){
    if (m.from >= current && m.from < SCHEMA_VERSION){
      try { const next = m.fn(data); if (next && typeof next === 'object') data = next; applied.push({ from: m.from, to: m.to, name: m.name }); }
      catch(e){ console.warn(`[migrateBackup] Migración ${m.from} → ${m.to} falló:`, e); }
    }
  }
  data.version = SCHEMA_VERSION;
  return { data, applied };
}
function computeVirtualRange(total, rowHeight, viewportHeight, scrollTop, buffer = 6){
  if (total <= 0) return { start: 0, end: 0, topPad: 0, bottomPad: 0 };
  if (!Number.isFinite(rowHeight) || rowHeight <= 0) rowHeight = 1;
  if (!Number.isFinite(viewportHeight) || viewportHeight < 0) viewportHeight = 0;
  if (!Number.isFinite(scrollTop) || scrollTop < 0) scrollTop = 0;
  if (!Number.isFinite(buffer) || buffer < 0) buffer = 0;
  const first = Math.floor(scrollTop / rowHeight);
  const visible = Math.ceil(viewportHeight / rowHeight);
  const start = Math.max(0, first - buffer);
  const end = Math.min(total, first + visible + buffer);
  const topPad = start * rowHeight;
  const bottomPad = Math.max(0, (total - end) * rowHeight);
  return { start, end, topPad, bottomPad };
}
function createLimiter(concurrency){
  const max = Math.max(1, parseInt(concurrency) || 1);
  let active = 0;
  const queue = [];
  function next(){
    if (active >= max || queue.length === 0) return;
    active++;
    const { fn, resolve, reject } = queue.shift();
    Promise.resolve().then(() => fn()).then(v => { active--; resolve(v); next(); }, e => { active--; reject(e); next(); });
  }
  return function limit(fn){ return new Promise((resolve, reject) => { queue.push({ fn, resolve, reject }); next(); }); };
}
function mergeCDs(a, b, choices = {}){
  if (!a && !b) return null;
  if (!a) return { ...b };
  if (!b) return { ...a };
  const merged = { ...a };
  for (const f of MERGEABLE_FIELDS){ if (choices[f.key] === 'b') merged[f.key] = b[f.key]; }

}
function chunk(arr, n){
  if (!Array.isArray(arr) || arr.length === 0) return [];

  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));

}
function qrPayload(cd, mode = 'url', baseUrl = ''){

function workspaceSlugify(name){

}
function validateWorkspaceName(name, existing = [], currentId = null){
  const clean = String(name || '').trim();
  if (!clean) return { ok: false, error: 'name_empty' };
  if (clean.length > 40) return { ok: false, error: 'name_too_long' };
  const lower = clean.toLowerCase();
  const dup = (existing || []).find(w => w.id !== currentId && String(w.name || '').toLowerCase() === lower);
  if (dup) return { ok: false, error: 'name_duplicated' };
  return { ok: true };
}
function workspaceColorFromSeed(seed){
  const s = String(seed || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return WORKSPACE_COLORS[Math.abs(h) % WORKSPACE_COLORS.length];
}
function isSafeWorkspaceId(id){ return typeof id === 'string' && /^[a-z0-9_]{1,40}$/.test(id); }
function normalizeTag(t){
  return String(t || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s_-]/g, '').replace(/\s+/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '').slice(0, TAG_MAX_LENGTH);
}
function parseTags(str){
  if (!str) return [];
  return [...new Set(String(str).split(/[,\n]/).map(normalizeTag).filter(Boolean))].slice(0, TAG_MAX_PER_CD);
}
function tagMatches(cdTags, query){
  const tags = Array.isArray(cdTags) ? cdTags : [];
  const wanted = String(query || '').toLowerCase().split(/[,\s]+/).filter(Boolean);
  if (!wanted.length) return true;
  return wanted.every(w => tags.some(t => t.includes(w)));
}
function tagColorFromSeed(tag, palette){
  const colors = Array.isArray(palette) && palette.length ? palette : ['#4fc3f7'];
  const s = String(tag || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return colors[Math.abs(h) % colors.length];
}
function fuzzyScore(text, query){
  const t = String(text || '').toLowerCase();
  const q = String(query || '').toLowerCase().trim();
  if (!q) return 0;
  if (t === q) return 1000;
  if (t.startsWith(q)) return 500;
  if (t.includes(q)) return 250;
  let ti = 0, qi = 0, score = 0;
  while (ti < t.length && qi < q.length){
    if (t[ti] === q[qi]){ qi++; score += 1; }
    ti++;
  }
  if (qi === q.length) return score;
  return -1;
}
function normalizeSavedFilter(obj){
  if (!obj || typeof obj !== 'object') return null;
  const name = String(obj.name || '').trim().slice(0, 40);
  if (!name) return null;
  return {
    id: obj.id || ('sf_' + Date.now().toString(36)),
    name,
    icon: String(obj.icon || '⭐').slice(0, 4),
    createdAt: obj.createdAt || new Date().toISOString(),
    filters: {
      q: String(obj.filters?.q || '').slice(0, 200),
      artista: String(obj.filters?.artista || '').slice(0, 120),
      subcat: String(obj.filters?.subcat || '').slice(0, 40),
      tagFilter: String(obj.filters?.tagFilter || '').slice(0, 30),
      cat: String(obj.filters?.cat || '').slice(0, 40),
      sortKey: String(obj.filters?.sortKey || 'nro').slice(0, 20),
      sortDir: (obj.filters?.sortDir === -1) ? -1 : 1,
      view: (obj.filters?.view === 'dashboard') ? 'dashboard' : 'table',
      estado: String(obj.filters?.estado || ''),
      formato: String(obj.filters?.formato || ''),
      anioDesde: String(obj.filters?.anioDesde || ''),
      anioHasta: String(obj.filters?.anioHasta || ''),
      ubicacion: String(obj.filters?.ubicacion || ''),
      portada: String(obj.filters?.portada || ''),
      prestamo: String(obj.filters?.prestamo || '')
    }
  };
}

/* ═══════════════════════════════════════════════════════════════════
   RUNNER
   ═══════════════════════════════════════════════════════════════════ */
(async function run(){
  let totalPass = 0, totalFail = 0;
  const resultsEl = document.getElementById('results');
  const summaryEl = document.getElementById('summary');
  const subtitleEl = document.getElementById('subtitle');

  let totalTests = 0;
  for (const s of _suites) totalTests += s.tests.length;
  subtitleEl.textContent = `${totalTests} tests · Funciones puras + Migraciones + Virtual + Limiter + Merge + Labels + i18n + Intl + Workspaces + Tags + Fuzzy`;

  for (const suite of _suites){
    let suitePass = 0, suiteFail = 0;
    const suiteEl = document.createElement('div');
    suiteEl.className = 'suite';
    const headEl = document.createElement('div');
    headEl.className = 'suite-head';
    const testsEl = document.createElement('div');

    for (const t of suite.tests){
      const testEl = document.createElement('div');
      testEl.className = 'test';
      try {
        const result = t.fn();
        if (result instanceof Promise) await result;
        testEl.classList.add('pass');
        testEl.innerHTML = `<span class="icon">✓</span><div class="body"><div class="name">${escapeHTML(t.name)}</div></div>`;
        suitePass++; totalPass++;
      } catch(err){
        testEl.classList.add('fail');
        testEl.innerHTML = `<span class="icon">✕</span><div class="body"><div class="name">${escapeHTML(t.name)}</div><div class="error">${escapeHTML(err.message)}</div></div>`;
        suiteFail++; totalFail++;
      }
      testsEl.appendChild(testEl);
    }

    const badge = suiteFail === 0
      ? `<span class="badge">✓ ${suitePass}/${suite.tests.length}</span>`
      : `<span class="badge err">✕ ${suiteFail} fallos</span>`;
    headEl.innerHTML = `<span>${escapeHTML(suite.name)}</span>${badge}`;
    suiteEl.appendChild(headEl);
    suiteEl.appendChild(testsEl);
    resultsEl.appendChild(suiteEl);
  }

  summaryEl.innerHTML = `
    <div class="sum-item total"><b>${totalPass + totalFail}</b><span>Total</span></div>
    <div class="sum-item ok"><b>${totalPass}</b><span>Aprobados</span></div>
    <div class="sum-item err"><b>${totalFail}</b><span>Fallados</span></div>
  `;

  const footer = document.getElementById('footer');
  if (totalFail === 0){
    footer.innerHTML = `✅ <b style="color:#5ddc9a">Todos los tests pasaron.</b> Discografía v8.0.0 — HDSystem IT`;
  } else {
    footer.innerHTML = `❌ <b style="color:#ff6b6b">${totalFail} test(s) fallaron.</b> Revisá el detalle arriba.`;
  }

  console.log(`%c🧪 Tests: ${totalPass} pass · ${totalFail} fail`, `color:${totalFail===0?'#5ddc9a':'#ff6b6b'};font-weight:bold;font-size:14px`);

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
